name: Build Standalone Software

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install requirements
      run: pip install pymupdf==1.23.26 pyinstaller pillow

    - name: Build the Portable Folder
      # Notice we removed the --onefile command here!
      run: pyinstaller --windowed --add-data "logo.jpg;." pdf_numberer.py

    - name: Upload the finished software
      uses: actions/upload-artifact@v4
      with:
        name: PDF-Numberer-Portable
        path: dist/pdf_numberer/
